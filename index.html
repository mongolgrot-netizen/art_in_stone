<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Сметчик PRO</title><style>body{font-family:Arial,sans-serif;background:#101318;color:#eee;margin:0}main{max-width:1100px;margin:auto;padding:18px}h1{margin:0 0 6px}.muted{color:#9aa4b2}.card{background:#181d25;border:1px solid #2b3440;border-radius:14px;padding:16px;margin:12px 0}button{padding:11px 14px;border:0;border-radius:9px;cursor:pointer;margin:4px}textarea,input{width:100%;box-sizing:border-box;background:#0e1218;color:#fff;border:1px solid #35404d;border-radius:8px;padding:10px;margin:5px 0}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #303844;text-align:left}.ok{color:#75d69b}.warn{color:#ffcc66}.err{color:#ff7d7d}</style></head><body><main><h1>AI Сметчик PRO</h1><div class="muted">Единый агент: документы → параметры → расчёт → смета</div><div class="card"><h2>1. Проект</h2><input id="project" placeholder="Название проекта"><input id="client" placeholder="Клиент"><textarea id="desc" rows="7" placeholder="Вставьте ТЗ или описание. Например: столешница 2400×700×30 мм, остров 1800×900×30 мм, мрамор, доставка, монтаж, такелаж."></textarea><input id="files" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.csv,.xlsx,.xls"><button onclick="analyze()">🔎 Разобрать</button><button onclick="save()">💾 Сохранить</button><span id="status" class="muted"></span></div><div class="card"><h2>2. Найденные параметры</h2><div id="findings">Пока нет данных.</div></div><div class="card"><h2>3. Смета</h2><table><thead><tr><th>Раздел</th><th>Позиция</th><th>Ед.</th><th>Кол.</th><th>Цена</th><th>Сумма</th></tr></thead><tbody id="est"></tbody></table><h2>Итого: <span id="total">0 ₽</span></h2></div></main><script>const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));let rows=[];function parse(t){t=t.replace(/,/g,'.');let out=[],m,rx=/(\\d+(?:\\.\\d+)?)\\s*[xх×]\\s*(\\d+(?:\\.\\d+)?)(?:\\s*[xх×]\\s*(\\d+(?:\\.\\d+)?))?\\s*(мм|см|м)?/gi;while(m=rx.exec(t)){let u=(m[4]||'мм').toLowerCase(),k=u==='м'?1:u==='см'?.01:.001;out.push({v:m[0],a:+m[1]*k,b:+m[2]*k,c:m[3]?+m[3]*k:null})}return out}function analyze(){let d=$('desc').value||'', dims=parse(d), fs=[...$('files').files];let f=[];dims.forEach(x=>f.push(['Размер',x.v,'геометрия','Высокая']));let mat=(d.match(/\\b(мрамор|гранит|оникс|кварцит|нержаве(?:ющая|й) сталь|AISI\\s*304|AISI\\s*316|сталь)\\b/ig)||[]);mat.forEach(x=>f.push(['Материал',x,'материал','Высокая']));let q=(d.match(/(\\d+(?:[.,]\\d+)?)\\s*(шт\\.?|м\\.?п\\.?|м²|м2|м³|м3|кг|ступен)/ig)||[]);q.forEach(x=>f.push(['Количество',x,'ТЗ','Высокая']));$('findings').innerHTML=f.length?'<table><tr><th>Тип</th><th>Значение</th><th>Источник</th><th>Уверенность</th></tr>'+f.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td><td>'+esc(x[2])+'</td><td class="ok">'+x[3]+'</td></tr>').join('')+'</table>':'<span class="warn">Параметры не найдены — требуется уточнение.</span>';rows=[];let area=dims.reduce((s,x)=>s+x.a*x.b,0);if(/столешниц|столешниц[а-я]*|столешк|остров|countertop/i.test(d)){if(area)rows.push(['Камень','Изготовление/обработка столешницы','м²',area,0]);}if(/такелаж|кран|манипулятор/i.test(d))rows.push(['Такелаж','Такелажные работы','компл.',1,0]);if(/доставк|рейс/i.test(d))rows.push(['Логистика','Доставка','рейс',1,0]);if(/монтаж|установк/i.test(d))rows.push(['Монтаж','Монтаж','компл.',1,0]);render();$('status').textContent=' Обработано файлов: '+fs.length+'.';}function render(){let total=0;$('est').innerHTML=rows.map((r,i)=>{let s=r[3]*r[4];total+=s;return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3].toFixed(3)+'</td><td><input value="'+r[4]+'" type="number" onchange="rows['+i+'][4]=+this.value;render()"></td><td>'+s.toFixed(2)+' ₽</td></tr>'}).join('');$('total').textContent=total.toLocaleString('ru-RU',{minimumFractionDigits:2})+' ₽'}function save(){localStorage.setItem('AI_SMET_PRO_PROJECT',JSON.stringify({project:$('project').value,client:$('client').value,desc:$('desc').value,rows}));$('status').textContent=' Сохранено в браузере.'}(()=>{try{let x=JSON.parse(localStorage.getItem('AI_SMET_PRO_PROJECT'));if(x){$('project').value=x.project||'';$('client').value=x.client||'';$('desc').value=x.desc||'';rows=x.rows||[];render()}}catch(e){}})();</script></body></html>
